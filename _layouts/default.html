<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Juan Cruz Linsalata">
  <meta name="creator" content="LinsaFTW">
  <meta name="robots" content="{{ page.robots | default: 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' }}">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://linsaftw.arkflame.com{{ page.url }}">

  <meta property="og:site_name" content="LinsaFTW">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:url" content="https://linsaftw.arkflame.com{{ page.url }}">
  <meta property="og:image" content="https://linsaftw.arkflame.com/assets/images/profile-picture.webp">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="https://linsaftw.arkflame.com/assets/images/profile-picture.webp">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/profile-picture.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/assets/images/profile-picture.webp">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/assets/images/banner.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="/assets/images/profile-picture.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="LLMs and agentic browsing guide for LinsaFTW">
  <link rel="stylesheet" href="/assets/css/main.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://linsaftw.arkflame.com/#person",
        "name": "Juan Cruz Linsalata",
        "alternateName": ["LinsaFTW", "ArkFlame Development"],
        "url": "https://linsaftw.arkflame.com/",
        "image": "https://linsaftw.arkflame.com/assets/images/profile-picture.webp",
        "jobTitle": "Minecraft Infrastructure Developer",
        "nationality": "Argentine",
        "knowsAbout": [
          "Minecraft server infrastructure",
          "Bukkit plugin development",
          "Spigot plugin development",
          "Paper plugin development",
          "Folia plugin support",
          "Velocity proxy security",
          "BungeeCord proxy security",
          "Minecraft packet security",
          "anti-exploit systems",
          "server performance"
        ],
        "worksFor": { "@id": "https://linsaftw.arkflame.com/#arkflame" },
        "sameAs": [
          "https://github.com/LinsaFTW",
          "https://github.com/ArkFlame",
          "https://arkflame.com",
          "https://x.com/LinsaFTW",
          "https://www.youtube.com/@LinsaFTW",
          "https://modrinth.com/user/LinsaFTW",
          "https://builtbybit.com/creators/linsaftw.152552/"
        ]
      },
      {
        "@type": "Organization",
        "@id": "https://linsaftw.arkflame.com/#arkflame",
        "name": "ArkFlame Studios",
        "alternateName": "ArkFlame",
        "url": "https://arkflame.com",
        "founder": { "@id": "https://linsaftw.arkflame.com/#person" },
        "sameAs": ["https://github.com/ArkFlame"]
      },
      {
        "@type": "WebSite",
        "@id": "https://linsaftw.arkflame.com/#website",
        "name": "LinsaFTW",
        "url": "https://linsaftw.arkflame.com/",
        "description": "Public profile and writing by LinsaFTW, a Minecraft infrastructure developer from Argentina and founder of ArkFlame Studios.",
        "publisher": { "@id": "https://linsaftw.arkflame.com/#person" },
        "inLanguage": "en"
      },
      {
        "@type": "WebPage",
        "@id": "https://linsaftw.arkflame.com{{ page.url }}#webpage",
        "url": "https://linsaftw.arkflame.com{{ page.url }}",
        "name": "{{ page.title | default: site.title }}",
        "description": "{{ page.description | default: site.description }}",
        "isPartOf": { "@id": "https://linsaftw.arkflame.com/#website" },
        "about": { "@id": "https://linsaftw.arkflame.com/#person" },
        "primaryImageOfPage": "https://linsaftw.arkflame.com/assets/images/profile-picture.webp",
        "inLanguage": "en"
      }
    ]
  }
  </script>
</head>
<body data-page="{{ page.page_id | default: '' }}">
  <div class="site-wrapper">
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <script src="/assets/js/posts.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
